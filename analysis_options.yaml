include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/src/rust/**
    - rust_builder/**
    - "**/*.g.dart"
    - build/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
