[package]
name = "rust_lib_pagashell"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1.0.104"
bytes = "1"
flutter_rust_bridge = "=2.13.0"
futures-util = "0.3"
russh = "0.62.4"
russh-sftp = "2.3.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
# The crates.io connector pins pre-release crypto conflicting with russh.
# Pin the Windows Progressive, legacy RemoteFX, Alpha and AVC444v2 fixes together.
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", features = ["connector", "session", "graphics", "dvc", "svc", "displaycontrol"] }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", features = ["openh264-bundled"] }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d" }
ironrdp-rdpeudp-tokio = { path = "vendor/ironrdp-rdpeudp-tokio" }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
x509-cert = "0.2"
rustls-native-certs = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vnc-rs = "0.6.0"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ipnet = "2"
tokio-util = { version = "0.7", features = ["rt"] }
unicode-width = "0.2"

[patch."https://github.com/Devolutions/IronRDP"]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-egfx = { path = "vendor/ironrdp-egfx" }
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
ironrdp-session = { path = "vendor/ironrdp-session" }

[target.'cfg(windows)'.dependencies]
ironrdp-egfx-native = { path = "vendor/ironrdp-egfx-native" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ironrdp-egfx-native = { path = "vendor/ironrdp-egfx-native" }

[dev-dependencies]
ironrdp-rdpemt = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d" }
openh264 = "0.9.9"
rcgen = "0.14"
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep CPU bitmap/video decoders usable during Flutter Debug sessions too.
[profile.dev.package.rust_lib_pagashell]
opt-level = 2

[profile.dev.package.ironrdp-graphics]
opt-level = 3

[profile.dev.package.ironrdp-session]
opt-level = 3

[profile.dev.package.ironrdp-egfx]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3
