[package]
name = "ironrdp-session"
version = "0.13.0"
description = "State machines to drive an RDP session"
readme = "README.md"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"

[lib]
doctest = false
test = false

[features]
default = []
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi"]
__test = ["dep:visibility"]

[dependencies]
ironrdp-bulk = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.2" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.3" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.10" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.10" }
ironrdp-error = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.2" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.11", features = ["std"] }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.10" }
ironrdp-rdpei = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.3" }
ironrdp-graphics = { path = "../ironrdp-graphics", version = "0.11" }
ironrdp-egfx = { path = "../ironrdp-egfx", version = "0.5" }
tracing = { version = "0.1", features = ["log"] }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true, features = ["std"] }
visibility = { version = "0.1", optional = true }
