[package]
name = "ironrdp-graphics"
version = "0.11.0"
readme = "README.md"
description = "RDP image processing primitives"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"

[lib]
doctest = false
# test = false

[features]
# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__test = ["dep:visibility"]

[dependencies]
bit_field = "0.10"
bitflags = "2.11"
bitvec = "1.0"
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.3" } # public
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "85e88c2424d8c36407f81540cc1f3cf8d3436a7d", version = "0.11", features = ["std"] } # public
byteorder = "1.5" # TODO: remove
num-derive = "0.5" # TODO: remove
num-traits = "0.2" # TODO: remove
yuv = { version = "0.8", features = ["rdp"] }
wide = "0.7" # portable SIMD for the inverse DWT (wasm/x86/ARM); `std::simd` is still nightly-only
visibility = { version = "0.1", optional = true }

[dev-dependencies]
bmp = "0.5"
bytemuck = "1.24"
expect-test = "1"
