[package]
name = "ironrdp-egfx-native"
version = "0.2.0"
description = "Native H.264 decoders for the IronRDP graphics and video channels"
readme = "README.md"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"

[lib]
doctest = false

[dependencies]
ironrdp-egfx = { path = "../ironrdp-egfx", version = "0.5" }
yuv = "0.8"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(windows)'.dependencies]
tracing = { version = "0.1", features = ["log"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
