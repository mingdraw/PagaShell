name: CI

on:
  workflow_dispatch:
    inputs:
      helpers_only:
        description: Only verify native update helper transactions
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'
  PUB_HOSTED_URL: https://pub.dev

jobs:
  update-helpers:
    name: Update helper ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: amd64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: windows-2022
            platform: windows
            arch: amd64
          - os: windows-11-arm
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_updater_helpers.py

  analyze-and-test:
    if: inputs.helpers_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rust-check:
    if: inputs.helpers_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake nasm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust

  build:
    if: inputs.helpers_only != true
    needs: [analyze-and-test, rust-check, update-helpers]
    name: Build ${{ matrix.target }} ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            target: linux
            arch: arm64
          - os: macos-15-intel
            target: macos
            arch: amd64
            xcode_arch: x86_64
          - os: macos-15
            target: macos
            arch: arm64
            xcode_arch: arm64
          - os: windows-2022
            target: windows
            arch: amd64
          - os: windows-11-arm
            target: windows
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev nasm
      - name: Install macOS build dependencies
        if: matrix.target == 'macos'
        run: brew install nasm
      - name: Install Windows build dependencies
        if: matrix.target == 'windows' && matrix.arch == 'amd64'
        run: |
          choco install nasm --yes --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ci-${{ matrix.target }}-${{ matrix.arch }}
      - name: Set up Flutter on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up Flutter on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed' }
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\flutter\bin"
      - run: flutter pub get
      - name: Verify update interface and exit lifecycle
        run: flutter test test/app_update_test.dart test/application/app_update_controller_test.dart test/domain/app_release_test.dart --reporter expanded
      - name: Build Linux and Windows
        if: matrix.target != 'macos'
        run: flutter build ${{ matrix.target }} --release
      - name: Build macOS
        if: matrix.target == 'macos'
        env:
          XCODE_ARCH: ${{ matrix.xcode_arch }}
        run: |
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos \
            -destination 'generic/platform=macOS' \
            ARCHS="$XCODE_ARCH" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
